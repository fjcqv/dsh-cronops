# dsh-cronops bundle patch: inserts the dual-face plugin row into the profile
# roster. The row is a bare plugin by package name: the node half (exports ".")
# runs in the host process (panel store, /open OpenAPI client, /api/dsh-cronops
# routes, agent tools), and the `dsh.client` declaration in package.json makes
# the browser half (exports "./client", served at /plugins/dsh-cronops/client.js)
# load in the web GUI.
- insert:
    - id: cronops
      name: 'dsh-cronops'
