name: publish

# Publishes the package to npm through Trusted Publishing (OIDC): no npm
# token, no one-time password. The npmjs side must authorize this exact
# workflow once — see "发布（Trusted Publishing）" in README.md.
on:
  # A tag push is the primary trigger: it works without creating a Release and
  # it is what `git push origin vX.Y.Z` does.
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token npm exchanges for a short-lived publish credential.
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@^11

      - name: Run the host self test
        run: node scripts/selftest.mjs

      # A release tag must match package.json, and an already published
      # version is skipped instead of failing the release.
      - name: Check version
        id: check
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "package version: $VERSION"
          echo "npm: $(npm --version), registry: $(npm config get registry)"
          TAG=""
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -n "$TAG" ] && [ "v$VERSION" != "$TAG" ]; then
            echo "tag $TAG does not match package version $VERSION" >&2
            exit 1
          fi
          if npm view "dsh-cronops@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-cronops@$VERSION is already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public
